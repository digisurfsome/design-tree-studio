# sgp1        - Singapore
# lon1        - London
# fra1        - Frankfurt
# tor1        - Toronto
# blr1        - Bangalore

# ===========================================
# SERVER SIZE OPTIONS (DigitalOcean)
# ===========================================
# s-1vcpu-512mb-10gb  - $4/month  (minimal)
